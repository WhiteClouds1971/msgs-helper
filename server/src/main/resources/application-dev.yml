# dev 环境 —— 本地开发调试（start-dev.sh 用这个 profile）
# 数据库来自 ~/Personal/Codes/my/dev-tools/compose.yml 里的 mysql 8.0 服务：
# 容器 dev-mysql 映射到宿主机 3306，账号 dev/dev，库 msgs-helper
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/msgs-helper?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
    username: dev
    password: dev
