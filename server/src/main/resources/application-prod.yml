# prod 环境 —— 实际使用（build.sh 以 --spring.profiles.active=prod 拉起）
# 与 dev 同一个 MySQL、同一套账号，只有日志级别不同；将来数据库挪到别的机器，
# 改这里的 url/username/password 即可，dev 不受影响
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/msgs-helper?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
    username: dev
    password: dev

# 生产不打 SQL 细节（application.yml 里的 debug 是给本地看的）
logging:
  level:
    com.msgshelper: info
